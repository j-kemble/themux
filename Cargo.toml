[workspace]
resolver = "2"
members = [
    "crates/themux-core",
    "crates/themux-socket",
    "crates/themux-cli",
    "crates/themux-agent",
    "crates/themux-notify",
    "crates/themux-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/themux-app/themux"
authors = ["themux contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# GTK4 (used by themux-app)
gtk4 = { version = "0.9", features = ["v4_16"] }
libadwaita = { version = "0.7", optional = true }

# WebKitGTK
webkit2gtk = { version = "0.12", features = ["v2_46"] }

# Desktop notifications
notify-rust = "4"

# Config
toml = "0.8"
dirs = "6"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Regex
regex = "1"
lazy_static = "1"

# SQLite (session store, browser history)
rusqlite = { version = "0.32", features = ["bundled"] }

# Sentry
sentry = { version = "0.35", optional = true }

# Shell words parsing
shell-words = "1"

# HMAC / SHA256 for socket auth relay
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Temp files
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
